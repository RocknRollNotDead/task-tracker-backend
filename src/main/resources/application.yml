server:
  port: 8080
  servlet:
    context-path: /api
spring:
  application:
    name:
      task-tracker


  datasource:
    url: jdbc:postgresql://${LOCALHOST:mydb}:5432/task_db
    username: ${DB_LOGIN}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
  jpa:
    show_sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

secret-key:
  ${SECRET_KEY_JWT}

kafka:
  url: ${LOCALHOST:kafka}:9092