server:
  port: 8080
  servlet:
    context-path: /api
spring:
  application:
    name:
      task-tracker


  datasource:
    url: jdbc:postgresql://${LOCALHOST:mydb}:5432/task_db
    username: ${DB_LOGIN}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
  jpa:
    show_sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true


management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true

secret-key:
  ${SECRET_KEY_JWT}

secrets:
  user:
    username: User
    password:  ${PASSWORD_USER}
    email: 2@a.ru
  admin:
    username: ${DB_LOGIN}
    password: ${DB_PASSWORD}
    email: 1@a.ru

kafka:
  url: ${LOCALHOST:kafka}:9092