server:
  port: 8080
  servlet:
    session:
      cookie:
        max-age: 7d
    context-path: /api
spring:
  application:
    name:
      task-tracker
  session:
    timeout: 7d

  servlet:

    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://${LOCALHOST:mydb}:5432/task_db
    username: ${DB_LOGIN}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
  jpa:
    show_sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true


  data:
    redis:
      host: ${LOCALHOST:redis}
      port: 6379